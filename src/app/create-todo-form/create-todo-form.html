
<div class="form-card">
  <form class="form-card_style" [formGroup]="form" (ngSubmit)="submitForm()">

    <div class="form-container">
      <h1>CREATE Todo FORM </h1>
      <label for="userId">User ID:</label>
      <input type="number" id="userId" class="form-input" formControlName="userId" />
      <div *ngIf="form.controls['userId'].invalid && (form.controls['userId'].dirty || form.controls['userId'].touched)"
        class="alert">
        <div *ngIf="form.controls['userId'].errors">User ID введено неправильно</div>
      </div>

      <label for="id">ID:</label>
      <input type="number" id="id" class="form-input" formControlName="id" />
      <div *ngIf="form.controls['id'].invalid && (form.controls['id'].dirty || form.controls['id'].touched)" class="alert">
        <div *ngIf="form.controls['id'].errors">ID введено неправильно</div>
      </div>

      <label for="title">Title:</label>
      <input type="text" id="title" class="form-input" formControlName="title" />
      <div *ngIf="form.controls['title'].invalid && (form.controls['title'].dirty || form.controls['title'].touched)"
        class="alert">
        <div *ngIf="form.controls['title'].errors">Title введено неправильно</div>
      </div>

      <div class="checkbox-group">
        <label for="completed">Completed:</label>
        <input type="checkbox" id="completed" formControlName="completed" />
      </div>
      <div *ngIf="form.controls['completed'].invalid && (form.controls['completed'].dirty || form.controls['completed'].touched)"
        class="alert">
        <div *ngIf="form.controls['completed'].errors">Completed введено неправильно</div>
      </div>

      <button class="submit-btn" type="submit" [disabled]="form.invalid">Create User</button>
    </div>

  </form>
</div>
