<h3 class="users-lists">Component Users list</h3>
<div class="users-lists-card">
  <div *ngFor="let user of users" class="card">
    <p>{{ user.name }}</p>
    <p>{{ user.email }}</p>
    <p>{{ user.website }}</p>
    <p>{{ user.company.name }}</p>
    <!-- <button (click)="deleteUser(user.id)" class="delete-button">удалить user</button> -->
  </div>
</div>
