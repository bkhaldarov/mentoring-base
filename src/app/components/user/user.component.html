<app-header></app-header>
<h3 class="users-lists">Component Users list</h3>
<div style="display: flex; width: 100%; flex-wrap: wrap;">
  <div *ngFor="let item of users" class="card">
    <p>{{(item).name }}</p>
    <p>{{(item).email }}</p>
    <p>{{(item).website }}</p>
    <p>{{(item).company.name}}</p>
    <button (click) ="deleteUser(item.id)" class="delete-button">удалить user</button>
  </div>
</div>
