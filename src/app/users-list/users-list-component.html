<h3 class="users-lists">component users list</h3>
<div style="display: flex; width: 100%; flex-wrap: wrap;">
  <div *ngFor="let item of users"
       style="width: 200px; height: 200px; border: 1px solid black; margin: 5px; padding: 10px;">
    <p>{{$any(item).name }}</p>
    <p>{{$any(item).email }}</p>
    <p>{{$any(item).website }}</p>
    <p>{{$any(item).company.name}}</p>
    <button (click) ="deleteUser(item.id)">удалить user</button>
  </div>
</div>
