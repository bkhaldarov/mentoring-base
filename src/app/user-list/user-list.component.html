<div>
  <button (click)="onGetUserslengthBtnClick()" class="button">Количества юзеров</button>
  <span>{{ usersCount$ | async }} </span>
  <span> {{ errorMessage$ | async }} </span>
</div>

<app-create-user-form (createUser)="createUser($event)"></app-create-user-form>
<h3 class="users-lists">Component Users list</h3>
<div class="users-lists-card">
    <div *ngFor="let user of users$ |async "  class="card">
      <app-user-card [user]="user" (deleteUser)="deleteUser($event)" (editUser)="editUser($event)"></app-user-card>
    </div>
</div>
